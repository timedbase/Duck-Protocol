# Self-hosted graph-node for the DuckProtocol Arc (5042) subgraph: three private services in the Render
# workspace, created through the Render API on 2026-09-14 with these settings (duckprotocol-arc-graph-*).
# The earlier Arc node (duckprotocol-arc-graph-*) is a separate, suspended set. Render reads a Blueprint from the repo
# root by default; to manage these services from this file, set the Blueprint file path to
# Arc/graphnode/render.yaml. Secrets (the postgres credentials) are sync:false and set on the services.
services:
  # ---- Self-hosted subgraph indexing for Arc (Goldsky doesn't support it
  # yet) -- mirrors graph-node's own reference docker-compose.yml exactly
  # (github.com/graphprotocol/graph-node/blob/master/docker/docker-compose.yml),
  # three private services (no public internet access -- only reachable from
  # other services in this Render project, plus the dashboard's Shell tab
  # for running one-off `graph deploy`/admin commands). Postgres is run
  # ourselves rather than using Render's managed Postgres product because
  # graph-node requires the database created with `C` locale/collation
  # (POSTGRES_INITDB_ARGS below) for correct indexing -- Render's managed
  # offering doesn't expose a locale option, and getting this wrong doesn't
  # fail loudly, it silently produces wrong query results in some cases.
  - type: pserv
    name: duckprotocol-arc-graph-postgres
    runtime: image
    plan: starter
    image:
      url: postgres:16
    disk:
      name: duckprotocol-arc-graph-postgres-data
      mountPath: /var/lib/postgresql/data
      sizeGB: 10
    envVars:
      # Must match postgres_user/postgres_pass/postgres_db on
      # duckprotocol-arc-graph-node below exactly -- Render prompts for each
      # sync:false var once per service during Blueprint setup, so these
      # don't auto-share a value the way an env var group would.
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_DB
        sync: false
      # A subdirectory of the disk mount: postgres won't initialize into a directory holding lost+found.
      - key: PGDATA
        value: /var/lib/postgresql/data/pgdata
      - key: POSTGRES_INITDB_ARGS
        value: "-E UTF8 --locale=C"

  - type: pserv
    name: duckprotocol-arc-graph-ipfs
    runtime: image
    plan: starter
    image:
      url: ipfs/kubo:latest
    disk:
      name: duckprotocol-arc-graph-ipfs-data
      mountPath: /data/ipfs
      sizeGB: 10

  - type: pserv
    name: duckprotocol-arc-graph-node
    runtime: image
    plan: standard
    image:
      url: graphprotocol/graph-node:latest
    envVars:
      - key: postgres_host
        value: duckprotocol-arc-graph-postgres
      - key: postgres_port
        value: "5432"
      # Must match POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB on
      # duckprotocol-arc-graph-postgres above exactly.
      - key: postgres_user
        sync: false
      - key: postgres_pass
        sync: false
      - key: postgres_db
        sync: false
      - key: ipfs
        value: duckprotocol-arc-graph-ipfs:5001
      # Network name here MUST match graphnode/subgraph.yaml's every
      # `network:` field exactly (currently "arc") -- graph-node routes a
      # subgraph's data source to whichever `ethereum` entry has the
      # matching network name, comma-separate more `name:url` pairs here if
      # this node ever indexes more than one chain.
      - key: ethereum
        value: "arc:https://rpc.arc-scan.org"
      - key: GRAPH_LOG
        value: info

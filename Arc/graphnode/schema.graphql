type ReliquifyMigration @entity(immutable: false) {
  id: String! # reliquify address + "-" + migrationId
  migrationId: BigInt!
  leader: Bytes!
  oldToken: Bytes!
  # The new token; set when the platform approves the migration.
  token: Token
  # Proposed -> Live -> Seeded, or Rejected / Aborted.
  status: String!
  snapshotBatches: Int!
  snapshotFinalized: Boolean!
  excludedCount: Int!
  # The leader's running snapshot total. Exclusions don't emit a new total, so this can lag them until
  # the snapshot is finalized, which sets the authoritative figure.
  eligibleSupply: BigInt!
  # The new token's whole fixed supply: the old token's totalSupply() at approval.
  newTokenSupply: BigInt
  # Old tokens deposited and still counted: pre-seed deposits net of refunds, plus every post-seed deposit.
  totalDeposited: BigInt!
  preSeedDeposited: BigInt!
  postSeedDeposited: BigInt!
  # Pre-seed deposits reached half of eligibleSupply, so the pool can be seeded.
  thresholdReached: Boolean!
  totalClaimed: BigInt!
  totalRefunded: BigInt!
  # Native ETH (Arc: USDC) the old tokens sold for when the pool was seeded.
  quoteRaised: BigInt
  poolId: Bytes
  seededAt: BigInt
  buybackQuoteSpent: BigInt!
  tokensBurned: BigInt!
  paused: Boolean!
  deposits: [ReliquifyDeposit!]! @derivedFrom(field: "migration")
  claims: [ReliquifyClaim!]! @derivedFrom(field: "migration")
  refunds: [ReliquifyRefund!]! @derivedFrom(field: "migration")
  buybacks: [ReliquifyBuyback!]! @derivedFrom(field: "migration")
  createdAtBlock: BigInt!
  createdAtTimestamp: BigInt!
  createdAtTx: Bytes!
}

